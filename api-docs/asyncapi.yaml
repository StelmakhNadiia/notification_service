asyncapi: 2.4.0
info:
  title: Notification Service - Async API Event Contracts
  version: 1.0.0
  description: >
    This specification defines the asynchronous event-driven contracts for the Notification Microservice.
    The service operates strictly as a reactive consumer within the platform's message broker, 
    subscribing to core domain events to process transactional emails and push notifications 
    while maintaining absolute loose coupling (NFR-D4).

servers:
  development:
    url: localhost:5672
    protocol: amqp
    description: Local RabbitMQ development broker
  production:
    url: rabbitmq.e-learning.platform:5672
    protocol: amqps
    description: Production RabbitMQ cluster with TLS encryption

channels:
  user.events.registered:
    subscribe:
      summary: Consume new user registration events for greeting notifications (FR-6.1)
      operationId: onUserRegistered
      message:
        $ref: '#/components/messages/UserRegisteredEvent'

  payment.events.succeeded:
    subscribe:
      summary: Consume successful course payment confirmations to trigger receipt emails (FR-5.2)
      operationId: onPaymentSucceeded
      message:
        $ref: '#/components/messages/PaymentSucceededEvent'

  progress.events.course_completed:
    subscribe:
      summary: Consume 100% course completion events to trigger certificate push alerts (FR-6.3)
      operationId: onCourseCompleted
      message:
        $ref: '#/components/messages/CourseCompletedEvent'

components:
  messages:
    UserRegisteredEvent:
      name: UserRegistered
      title: User Registered Event
      summary: Emitted atomically by the User Service when a new account is successfully verified.
      contentType: application/json
      payload:
        type: object
        required:
          - trace_id
          - user_id
          - email
          - user_name
        properties:
          trace_id:
            type: string
            format: uuid
            description: Distributed tracing identifier used to track end-to-end processing latency (NFR-O4).
          user_id:
            type: string
            format: uuid
            description: The unique decoupled ID of the user generated by the source microservice.
          email:
            type: string
            format: email
            description: The target recipient email address for transactional greeting.
          user_name:
            type: string
            description: The display name of the user used for dynamic template parsing.

    PaymentSucceededEvent:
      name: PaymentSucceeded
      title: Payment Succeeded Event
      summary: Emitted by the Payment Service immediately after a financial transaction clears.
      contentType: application/json
      payload:
        type: object
        required:
          - trace_id
          - transaction_id
          - user_id
          - email
          - course_title
          - amount
        properties:
          trace_id:
            type: string
            format: uuid
            description: Distributed tracing identifier (NFR-O4).
          transaction_id:
            type: string
            format: uuid
            description: Global ledger tracking reference for accountability.
          user_id:
            type: string
            format: uuid
          email:
            type: string
            format: email
          course_title:
            type: string
            description: Premium course name required to fulfill the confirmation template injection.
          amount:
            type: number
            description: The total transaction volume. Note that fields are audited under encryption rules (NFR-S4).

    CourseCompletedEvent:
      name: CourseCompleted
      title: Course Completed Event
      summary: Emitted by the Progress Service when a student completes all core modules.
      contentType: application/json
      payload:
        type: object
        required:
          - trace_id
          - user_id
          - email
          - course_id
          - certificate_uuid
        properties:
          trace_id:
            type: string
            format: uuid
          user_id:
            type: string
            format: uuid
          email:
            type: string
            format: email
          course_id:
            type: string
            format: uuid
          certificate_uuid:
            type: string
            format: uuid
            description: Unique secure identifier of the newly generated digital credential.